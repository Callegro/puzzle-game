:root{font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;color:#29382f;background:#e8ede5}*{box-sizing:border-box}body{margin:0;overflow:hidden;touch-action:none}button{font:inherit;cursor:pointer;border:none}#app{width:100vw;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:8px;background:#e8ede5}header{width:min(100%,1300px);display:flex;align-items:center;justify-content:space-between;gap:10px}header strong{font-size:clamp(16px,2vw,24px)}header small{color:#69776c}header .actions{display:flex;gap:7px;align-items:center}.pill{border-radius:30px;background:#fff;padding:9px 15px;color:#334b38;font-weight:650;box-shadow:0 2px 8px #29382f12}.pill.active{background:#c7debf}#counter{font-weight:800;font-size:clamp(16px,2vw,22px);white-space:nowrap}#game{width:min(100%,1300px);height:min(calc(100dvh - 83px),calc(100vw * 660 / 1180));min-height:0;display:block;touch-action:none;border-radius:14px;box-shadow:0 8px 28px #43544223;background:#f4f6ef}#intro{position:fixed;inset:0;background:#566b57ee;z-index:5;display:flex;justify-content:center;align-items:center;text-align:center;padding:20px}#intro .panel{max-width:410px;background:#fffaf2;padding:35px;border-radius:25px;box-shadow:0 10px 45px #0004}#intro h1{font-size:34px;margin:0 0 12px}#intro p{line-height:1.7;color:#627166}#intro button{background:#637e60;color:white;font-weight:750;font-size:20px;padding:16px 35px;border-radius:14px;margin-top:14px}#rotate{display:none;position:fixed;inset:0;background:#e8ede5;z-index:10;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:22px}@media(orientation:portrait){#rotate{display:flex}}@media(max-height:490px){header .pill{padding:5px 12px}header strong{font-size:16px}#app{gap:2px}#game{height:min(calc(100dvh - 50px),calc(100vw * 660 / 1180))}}

<div id="rotate">📱 아이패드를 가로로 돌려주세요.</div>
<div id="app"><header><div><strong>🧩 우리반 가족 퍼즐 맞추기</strong></div><div class="actions"><span id="counter">0 / 9</span><button id="hint" class="pill">👁 사진 힌트</button><button id="reset" class="pill">↻ 다시 섞기</button><button id="levelsBtn" class="pill">난이도</button></div></header><div id="missing" role="alert"></div><canvas id="game" aria-label="직소 퍼즐 게임"></canvas></div>

<div id="families"><div class="panel"><h1>가족을 선택해요</h1><div class="family-options"><button type="button" data-family="narin" aria-label="나린이네 가족 선택"><svg viewBox="0 0 180 160" aria-hidden="true" focusable="false"><path d="M12 73 L90 12 L168 73 L156 88 L149 82 L149 148 Q149 154 143 154 H37 Q31 154 31 148 V82 L24 88 Z" fill="#7AAB88" stroke="#496D53" stroke-width="5" stroke-linejoin="round"/><path d="M12 73 L90 12 L168 73" fill="none" stroke="#496D53" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><path d="M39 86 H141 V139 H39Z" fill="#ffffff" fill-opacity=".11" rx="7"/><text class="house-name" x="90" y="119" text-anchor="middle">나린이네</text></svg></button><button type="button" data-family="seungeun" aria-label="승은이네 가족 선택"><svg viewBox="0 0 180 160" aria-hidden="true" focusable="false"><path d="M12 73 L90 12 L168 73 L156 88 L149 82 L149 148 Q149 154 143 154 H37 Q31 154 31 148 V82 L24 88 Z" fill="#D69C76" stroke="#996647" stroke-width="5" stroke-linejoin="round"/><path d="M12 73 L90 12 L168 73" fill="none" stroke="#996647" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><path d="M39 86 H141 V139 H39Z" fill="#ffffff" fill-opacity=".11" rx="7"/><text class="house-name" x="90" y="119" text-anchor="middle">승은이네</text></svg></button><button type="button" data-family="yunji" aria-label="윤지네 가족 선택"><svg viewBox="0 0 180 160" aria-hidden="true" focusable="false"><path d="M12 73 L90 12 L168 73 L156 88 L149 82 L149 148 Q149 154 143 154 H37 Q31 154 31 148 V82 L24 88 Z" fill="#9A9BCB" stroke="#676C9E" stroke-width="5" stroke-linejoin="round"/><path d="M12 73 L90 12 L168 73" fill="none" stroke="#676C9E" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><path d="M39 86 H141 V139 H39Z" fill="#ffffff" fill-opacity=".11" rx="7"/><text class="house-name" x="90" y="119" text-anchor="middle">윤지네</text></svg></button></div></div></div>
<div id="levels"><div class="panel"><h1>난이도 선택</h1><div class="level-options"><button data-level="easy">쉬워요<span>왕 큰 조각 모험</span></button><button data-level="normal">재밌어요<span>조금더 조각조각</span></button><button data-level="hard">어려워요<span>도전! 퍼즐 박사</span></button></div><button id="familyBackBtn" type="button">🏠 다른 가족 고를래요</button></div></div>

<script>
'use strict';
const LEVELS={easy:{rows:3,cols:3,name:'쉬움'},normal:{rows:4,cols:4,name:'보통'},hard:{rows:5,cols:5,name:'어려움'}};
const FAMILIES={narin:{name:'나린이네 가족',file:'assets/photo1.png',sound:'assets/나린이네가족이에요.mp3'},seungeun:{name:'승은이네 가족',file:'assets/photo2.png',sound:'assets/승은이네가족이에요.mp3'},yunji:{name:'윤지네 가족',file:'assets/photo3.png',sound:'assets/윤지네가족이에요.mp3'}};
let selectedFamily=null;
// 시작 화면에서 모든 사진을 병렬 로딩. 사진 준비 전에는 게임 진입을 막는다.
const imageCache={};
const audioCache={};
const backgroundMusic=new Audio('assets/background.mp3');
backgroundMusic.loop=true;backgroundMusic.preload='auto';backgroundMusic.volume=.22;
let musicActivated=false;
let assetImagesReady=false;
function preloadAssets(){
 const keys=Object.keys(FAMILIES);
 const promises=keys.map(key=>new Promise((resolve,reject)=>{
   const img=new Image();imageCache[key]=img;
   img.onload=()=>resolve();
   img.onerror=()=>reject(new Error(FAMILIES[key].file));
   img.src=FAMILIES[key].file;
 }));
 for(const key of keys){
   const a=new Audio(FAMILIES[key].sound);
   a.preload='auto';a.volume=1;audioCache[key]=a;
   try{a.load()}catch(e){}
 }
 try{backgroundMusic.load()}catch(e){}
 Promise.allSettled(promises).then(results=>{
   const missing=results.map((r,i)=>r.status==='rejected'?FAMILIES[keys[i]].file:null).filter(Boolean);
   assetImagesReady=missing.length===0;
   const start=$('start'),status=$('loadStatus');
   if(assetImagesReady){start.disabled=false;start.textContent='게임 시작';status.textContent='준비 완료! 게임을 시작해요 🎈';}
   else{start.disabled=true;start.textContent='사진 확인 필요';status.textContent='사진 파일을 확인해 주세요: '+missing.join(', ');}
 });
}
function startBackgroundMusic(){
 musicActivated=true;
 const promise=backgroundMusic.play();
 if(promise&&promise.catch)promise.catch(()=>{});
}
function playFamilyVoice(){
 const a=audioCache[selectedFamily];if(!a)return;
 // 배경음과 가족 음성은 서로 별도 Audio 객체이므로 동시에 재생 가능
 try{a.pause();a.currentTime=0;}catch(e){}
 const promise=a.play();if(promise&&promise.catch)promise.catch(()=>{});
}
function stopFamilyVoices(){
 for(const a of Object.values(audioCache)){
  a.pause();try{a.currentTime=0}catch(e){}
 }
}

const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=1180,H=660,board={x:31,y:113,w:720,h:480},tray={x:788,y:113,w:358,h:480};
let rows=3,cols=3,pw=240,ph=160,image=new Image(),imageLoaded=false;
let imageRequestId=0;
let pieces=[],drag=null,shownHint=false,completed=0,started=false,level='easy';
let vertical=[],horizontal=[];
let renderBusy=false;
let finished=false,celebrationStart=0,confetti=[],celebrationFrame=0,celebrationVersion=0;
const restartButton={x:826,y:387,w:282,h:65};
const chooseButton={x:826,y:470,w:282,h:65};
function isInside(q,b){return q.x>=b.x&&q.x<=b.x+b.w&&q.y>=b.y&&q.y<=b.y+b.h;}
// Always invalidate animation frames from the previous round before resetting state.
let fireworks=[];
function stopCelebration(){
 celebrationVersion++;
 if(celebrationFrame)cancelAnimationFrame(celebrationFrame);
 celebrationFrame=0;
 celebrationStart=0;
 confetti=[];
 fireworks=[];
 finished=false;
}
// Larger, brighter celebration with staggered fireworks and confetti.
const PARTY_DURATION=4600;
function celebrate(){
 // Fresh timeline and particles on EVERY win, even after restart or difficulty change.
 stopCelebration();
 const version=celebrationVersion;
 finished=true;celebrationStart=performance.now();
 playFamilyVoice();
 const colors=['#ffce44','#ff6e85','#62d9bf','#66b4ff','#b68cff','#ff954c','#fdfcdb'];
 // Eight large bursts from several positions; stagger their timing so the effect keeps going.
 const centers=[
  [160,140,0],[605,105,170],[1020,142,330],
  [340,300,660],[855,245,850],[560,385,1200],
  [148,400,1550],[1040,420,1950],[570,170,2500]
 ];
 centers.forEach(([x,y,delay],k)=>{
  const rays=[];
  for(let i=0;i<42;i++){
   const angle=(i/42)*Math.PI*2+(Math.random()-.5)*.09;
   rays.push({angle,speed:105+Math.random()*125,size:5+Math.random()*7,
    color:colors[(i+k)%colors.length],star:i%6===0});
  }
  fireworks.push({x,y,delay,rays});
 });
 // Large pieces of paper fall from the top and burst in from both edges.
 for(let i=0;i<360;i++){
  const side=i%3,delay=Math.random()*1750;
  let x,y,vx,vy;
  if(side===0){x=Math.random()*W;y=-30-Math.random()*85;vx=(Math.random()-.5)*120;vy=100+Math.random()*130;}
  else if(side===1){x=-22;y=80+Math.random()*440;vx=110+Math.random()*190;vy=-115+Math.random()*190;}
  else{x=W+22;y=80+Math.random()*440;vx=-(110+Math.random()*190);vy=-115+Math.random()*190;}
  confetti.push({x,y,vx,vy,size:7+Math.random()*10,spin:Math.random()*6.28,
   rotate:(Math.random()-.5)*13,delay,color:colors[i%colors.length],star:i%11===0});
 }
 const animate=()=>{
  // Ignore callbacks belonging to a past puzzle completion.
  if(version!==celebrationVersion||!finished)return;
  draw();
  if(performance.now()-celebrationStart<PARTY_DURATION){
   celebrationFrame=requestAnimationFrame(animate);
  }else{
   celebrationFrame=0;confetti=[];fireworks=[];draw();
  }
 };
 celebrationFrame=requestAnimationFrame(animate);
}
function drawFinishPanel(){
 ctx.save();
 roundRect(tray.x,tray.y,tray.w,tray.h,16,'#fff1d4');
 ctx.textAlign='center';
 ctx.fillStyle='#48684e';ctx.font='bold 43px system-ui';ctx.fillText('🎉',tray.x+tray.w/2,230);
 ctx.font='bold 32px system-ui';ctx.fillText('퍼즐 완성!',tray.x+tray.w/2,285);
 ctx.font='18px system-ui';ctx.fillStyle='#786c58';ctx.fillText('모든 조각을 맞췄어요!',tray.x+tray.w/2,324);
 for(const [b,label] of [[restartButton,'↻  다시 하기'],[chooseButton,'가족 고르기']]){
  roundRect(b.x,b.y,b.w,b.h,16,label.includes('다시')?'#ff83a6':'#7f81df');
  ctx.fillStyle='#fff';ctx.font='bold 23px system-ui';ctx.fillText(label,b.x+b.w/2,b.y+42);
 }
 ctx.restore();
}
function drawStar(x,y,outer,inner,points=5){
 ctx.beginPath();
 for(let i=0;i<points*2;i++){
  const angle=i*Math.PI/points-Math.PI/2;
  const r=i%2===0?outer:inner;
  const px=x+Math.cos(angle)*r,py=y+Math.sin(angle)*r;
  if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
 }
 ctx.closePath();ctx.fill();
}
function drawCelebration(){
 const elapsed=performance.now()-celebrationStart;
 ctx.save();
 // Large radial firework blooms with bright glowing cores and moving streaks.
 for(const burst of fireworks){
  const t=(elapsed-burst.delay)/1000;
  if(t<0||t>1.45)continue;
  const progress=Math.min(1,t/.95);
  const fade=Math.min(1,t*5)*Math.max(0,1-t/1.45);
  ctx.save();ctx.globalAlpha=fade;
  for(const r of burst.rays){
   const ux=Math.cos(r.angle),uy=Math.sin(r.angle);
   const radius=r.speed*progress;
   const x=burst.x+ux*radius;
   const y=burst.y+uy*radius+32*t*t;
   ctx.strokeStyle=r.color;ctx.lineWidth=r.size*.44;ctx.lineCap='round';
   ctx.shadowColor=r.color;ctx.shadowBlur=11;
   ctx.beginPath();ctx.moveTo(x-ux*(15+14*progress),y-uy*(15+14*progress));ctx.lineTo(x,y);ctx.stroke();
   if(r.star){ctx.fillStyle=r.color;drawStar(x,y,r.size*1.15,r.size*.48);}
  }
  ctx.shadowBlur=0;
  if(t<.32){ctx.globalAlpha=(1-t/.32)*.85;ctx.fillStyle='#fff7d6';
   ctx.beginPath();ctx.arc(burst.x,burst.y,12+40*t,0,Math.PI*2);ctx.fill();}
  ctx.restore();
 }
 // Floating confetti passes over the finished image temporarily, then clears entirely.
 for(const f of confetti){
  const t=(elapsed-f.delay)/1000;if(t<0||t>2.7)continue;
  ctx.globalAlpha=Math.max(0,Math.min(1,t*7, (2.7-t)/.65));
  const x=f.x+f.vx*t,y=f.y+f.vy*t+95*t*t;
  ctx.save();ctx.translate(x,y);ctx.rotate(f.spin+f.rotate*t);
  ctx.fillStyle=f.color;
  if(f.star)drawStar(0,0,f.size*1.1,f.size*.45);
  else ctx.fillRect(-f.size/2,-f.size/2,f.size,f.size*.7);
  ctx.restore();
 }
 ctx.restore();
}
const $=id=>document.getElementById(id);
function randSign(){return Math.random()<.5?-1:1}
function initEdges(){
 // 하나의 경계에 부호를 정확히 하나만 부여. 양쪽 조각은 이 공통 경계를 서로 반대 방향으로 따라감.
 vertical=Array.from({length:rows},()=>Array.from({length:cols-1},randSign));
 horizontal=Array.from({length:rows-1},()=>Array.from({length:cols},randSign));
}
// 모든 접합부는 단 하나의 정방향 베지어 곡선으로 정의하고,
// 반대쪽 조각은 같은 곡선을 역순으로 추적한다. 굴곡이 100% 일치한다.
function edge(path,sx,sy,ex,ey,sign,reverse=false){
 const dx=ex-sx,dy=ey-sy,L=Math.hypot(dx,dy);
 const start=reverse?[ex,ey]:[sx,sy];
 if(!sign){path.lineTo(reverse?sx:ex,reverse?sy:ey);return;}
 const nx=dy/L,ny=-dx/L;
 const h=Math.min(pw,ph)*.19*sign;
 const pt=(t,d)=>[sx+dx*t+nx*d,sy+dy*t+ny*d];
 // segment data: [start, control1, control2, end], normalized canonical coordinates
 const seg=[
  [[0,0],[.12,0],[.24,0],[.32,0]],
  [[.32,0],[.41,0],[.39,h*.32],[.37,h*.42]],
  [[.37,h*.42],[.25,h*1.22],[.40,h*1.25],[.50,h*1.25]],
  [[.50,h*1.25],[.60,h*1.25],[.75,h*1.22],[.63,h*.42]],
  [[.63,h*.42],[.61,h*.32],[.59,0],[.68,0]],
  [[.68,0],[.77,0],[.88,0],[1,0]],
 ];
 if(!reverse){
  for(const v of seg){path.bezierCurveTo(...pt(...v[1]),...pt(...v[2]),...pt(...v[3]));}
 }else{
  for(let i=seg.length-1;i>=0;i--){const v=seg[i];path.bezierCurveTo(...pt(...v[2]),...pt(...v[1]),...pt(...v[0]));}
 }
}
function pathFor(r,c){
 const p=new Path2D();p.moveTo(0,0);
 edge(p,0,0,pw,0,r===0?0:horizontal[r-1][c]);
 edge(p,pw,0,pw,ph,c===cols-1?0:vertical[r][c]);
 edge(p,0,ph,pw,ph,r===rows-1?0:horizontal[r][c],true);
 edge(p,0,0,0,ph,c===0?0:vertical[r][c-1],true);
 p.closePath();return p;
}
function updateCounter(){$('counter').textContent=completed+' / '+rows*cols}
function shuffle(){
 stopFamilyVoices();
 stopCelebration();
 if(!imageLoaded)return;
 completed=0;drag=null;
 initEdges();
 const count=rows*cols,order=Array.from({length:count},(_,i)=>i);
 for(let i=count-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
 // 보관함의 크기에 맞춰 난이도별로 초기 조각을 축소해 배열.
 const trayCols=cols;
 const trayRows=Math.ceil(count/trayCols);
 const cellW=(tray.w-30)/trayCols,cellH=(tray.h-35)/trayRows;
 const miniScale=Math.min(.48,(cellW-14)/pw,(cellH-14)/ph);
 pieces=[];
 for(let k=0;k<count;k++){
  const i=order[k],r=Math.floor(i/cols),c=i%cols;
  const tc=k%trayCols,tr=Math.floor(k/trayCols);
  pieces.push({r,c,path:pathFor(r,c),x:tray.x+16+tc*cellW+(cellW-pw*miniScale)/2,y:tray.y+15+tr*cellH+(cellH-ph*miniScale)/2,scale:miniScale,restScale:miniScale,locked:false});
 }
 updateCounter();draw();
}
function setup(){const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(1,0,0,1,0,0);draw()}
function roundRect(x,y,w,h,rad,fill){ctx.beginPath();ctx.roundRect(x,y,w,h,rad);ctx.fillStyle=fill;ctx.fill()}
function drawPiece(p){
 ctx.save();ctx.translate(p.x,p.y);ctx.scale(p.scale,p.scale);
 ctx.shadowColor=p.locked?'#15231522':'#1b2b2370';ctx.shadowBlur=p.locked?1:9;ctx.shadowOffsetY=p.locked?0:3;
 ctx.fillStyle='#fff';ctx.fill(p.path);ctx.shadowColor='transparent';ctx.shadowOffsetY=0;ctx.shadowBlur=0;
 ctx.save();ctx.clip(p.path);
 // 바깥쪽 요철도 원본 이미지의 정확한 이웃 픽셀을 사용한다.
 if(imageLoaded)ctx.drawImage(image,-p.c*pw,-p.r*ph,board.w,board.h);
 ctx.restore();ctx.strokeStyle=p.locked?'#d7e6da':'#fdfdfd';ctx.lineWidth=p.locked?1:2.4;ctx.stroke(p.path);
 ctx.restore();
}
function draw(){
 if(renderBusy)return;
 renderBusy=true;
 try{
  // 매 프레임 캔버스를 완전히 초기화. 그림 데이터와 게임 UI는 분리.
  ctx.save();ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#f6f7f0';ctx.fillRect(0,0,W,H);
  roundRect(15,18,750,620,18,'#ddf5f5');
  roundRect(776,18,389,620,18,'#ffe6f0');
  ctx.font='bold 21px system-ui';ctx.fillStyle='#6b66b0';ctx.fillText('퍼즐판',32,55);

  ctx.fillStyle='#be5e88';ctx.font='bold 21px system-ui';ctx.fillText(finished?'축하해요!':'퍼즐 조각',790,55);

  if(finished)drawFinishPanel();
  else roundRect(tray.x,tray.y,tray.w,tray.h,12,'#fff1cf');
  // 퍼즐판은 반드시 독립적인 클리핑 공간에서 한 번만 그림.
  ctx.save();ctx.beginPath();ctx.rect(board.x,board.y,board.w,board.h);ctx.clip();
  ctx.fillStyle='#f9faf7';ctx.fillRect(board.x,board.y,board.w,board.h);
  if(imageLoaded){
   ctx.save();ctx.globalAlpha=finished?1:(shownHint?.28:.075);
   ctx.drawImage(image,board.x,board.y,board.w,board.h);ctx.restore();
  }
  // 격자: 서로 공유하는 경계를 정확히 1회만 그림.
  if(!finished){
  ctx.strokeStyle='#84978b99';ctx.lineWidth=1.2;
  for(let r=0;r<rows;r++)for(let c=0;c<cols-1;c++){
   ctx.beginPath();ctx.moveTo(board.x+(c+1)*pw,board.y+r*ph);
   edge(ctx,board.x+(c+1)*pw,board.y+r*ph,board.x+(c+1)*pw,board.y+(r+1)*ph,vertical[r][c]);ctx.stroke();
  }
  for(let r=0;r<rows-1;r++)for(let c=0;c<cols;c++){
   ctx.beginPath();ctx.moveTo(board.x+c*pw,board.y+(r+1)*ph);
   edge(ctx,board.x+c*pw,board.y+(r+1)*ph,board.x+(c+1)*pw,board.y+(r+1)*ph,horizontal[r][c]);ctx.stroke();
  }
  }
  ctx.restore();
  ctx.strokeStyle='#8ba28e';ctx.lineWidth=3;ctx.strokeRect(board.x,board.y,board.w,board.h);
  // 완성한 조각을 먼저, 나머지 조각을 그 위에 그린다.
  if(!finished){
   for(const p of pieces)if(p.locked)drawPiece(p);
   for(const p of pieces)if(!p.locked&&(!drag||drag.p!==p))drawPiece(p);
   if(drag)drawPiece(drag.p);
  }else{drawCelebration();}

  ctx.restore();
 }finally{renderBusy=false}
}
function coords(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
canvas.addEventListener('pointerdown',e=>{
 if(!started||!imageLoaded)return;
 const q=coords(e);
 if(finished){
  if(isInside(q,restartButton))shuffle();
  else if(isInside(q,chooseButton))openFamilies();
  e.preventDefault();return;
 }
 for(let k=pieces.length-1;k>=0;k--){
  const p=pieces[k];if(p.locked)continue;
  const lx=(q.x-p.x)/p.scale,ly=(q.y-p.y)/p.scale;
  if(ctx.isPointInPath(p.path,lx,ly)){
   // 집어든 동안만 1배로 확대한다. 손을 놓으면 원래 축소 크기로 돌아간다.
   const cx=lx,cy=ly;
   drag={p,id:e.pointerId,offX:cx,offY:cy};
   p.scale=1;p.x=q.x-cx;p.y=q.y-cy;
   pieces.splice(k,1);pieces.push(p);
   canvas.setPointerCapture(e.pointerId);e.preventDefault();draw();break;
  }
 }
});
canvas.addEventListener('pointermove',e=>{
 if(!drag||drag.id!==e.pointerId)return;
 const q=coords(e);drag.p.x=q.x-drag.offX;drag.p.y=q.y-drag.offY;draw();e.preventDefault();
});
function release(e){
 if(!drag||drag.id!==e.pointerId)return;
 const {p}=drag,tx=board.x+p.c*pw,ty=board.y+p.r*ph;
 // 올바른 위치에서만 고정하고, 그 외에는 현재 위치에 축소해서 둔다.
 if(e.type!=='pointercancel'&&Math.hypot(p.x-tx,p.y-ty)<Math.min(65,pw*.5)){
  p.x=tx;p.y=ty;p.scale=1;p.locked=true;completed++;updateCounter();
  if(completed===rows*cols)celebrate();
 }else{
  const mx=p.x+pw/2,my=p.y+ph/2;
  p.scale=p.restScale;
  p.x=mx-pw*p.scale/2;p.y=my-ph*p.scale/2;
 }
 drag=null;draw();e.preventDefault();
}
canvas.addEventListener('pointerup',release);
canvas.addEventListener('pointercancel',release);
function selectLevel(next){
 const cfg=LEVELS[next];
 const family=FAMILIES[selectedFamily];
 if(!cfg||!family)return;
 // Ignore callbacks from an earlier level if the player changes levels while an image loads.
  ++imageRequestId;
  level=next;rows=cfg.rows;cols=cfg.cols;pw=board.w/cols;ph=board.h/rows;
  stopFamilyVoices();stopCelebration();started=true;imageLoaded=false;pieces=[];completed=0;drag=null;shownHint=false;
  initEdges();
  $('hint').classList.remove('active');
  $('missing').style.display='none';$('levels').style.display='none';$('families').style.display='none';$('intro').style.display='none';
  image=imageCache[selectedFamily];
  if(!image || !image.complete || !image.naturalWidth){
   $('missing').textContent=`사진을 불러오지 못했어요: ${family.file}`;
   $('missing').style.display='block';draw();return;
  }
  imageLoaded=true;
  shuffle();
}
function cancelCurrentRound(){
 stopFamilyVoices();
 // Invalidate pending image requests and any fireworks RAF before switching screens.
 imageRequestId++;
 stopCelebration();
 if(drag){try{if(canvas.hasPointerCapture(drag.id))canvas.releasePointerCapture(drag.id)}catch(e){}}
 drag=null;pieces=[];completed=0;started=false;imageLoaded=false;shownHint=false;
 $('hint').classList.remove('active');$('missing').style.display='none';
 updateCounter();
}
function openFamilies(){
 cancelCurrentRound();selectedFamily=null;
 $('levels').style.display='none';$('families').style.display='flex';draw();
}
function chooseFamily(key){
 if(!FAMILIES[key])return;
 cancelCurrentRound();selectedFamily=key;
 $('families').style.display='none';$('levels').style.display='flex';draw();
}
function openLevels(){
 if(!selectedFamily){openFamilies();return;}
 cancelCurrentRound();$('families').style.display='none';$('levels').style.display='flex';draw();
}
$('start').onclick=()=>{if(!assetImagesReady)return;startBackgroundMusic();openFamilies()};$('levelsBtn').onclick=openLevels;
$('familyBackBtn').onclick=openFamilies;
document.querySelectorAll('[data-family]').forEach(b=>b.onclick=()=>chooseFamily(b.dataset.family));
document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>selectLevel(b.dataset.level));
$('hint').onclick=()=>{shownHint=!shownHint;$('hint').classList.toggle('active',shownHint);draw()};
$('reset').onclick=shuffle;
// 페이지의 기본 이미지/텍스트 드래그와 길게 누르기 메뉴만 금지.
// Canvas의 Pointer Events 퍼즐 이동은 그대로 사용한다.
document.addEventListener('dragstart',e=>e.preventDefault());
document.addEventListener('selectstart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('resize',setup);initEdges();setup();preloadAssets();
</script></body></html>
